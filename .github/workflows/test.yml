name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change only touches documentation. The heavy jobs are
  # skipped at job level (not via workflow-level paths-ignore) so that the
  # required status checks still report "skipped", which counts as passing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect docs-only change
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -u
          docs_only=false
          files=""
          ok=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files="$(git diff --name-only "origin/${BASE_REF}...HEAD")" || ok=false
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              ok=false
            else
              files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")" || ok=false
            fi
          else
            ok=false
          fi

          echo "Changed files:"
          echo "$files"

          if [ "$ok" = true ] && [ -n "$files" ]; then
            docs_only=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/*|templates/*|examples/*|README.md|LICENSE|.github/*.md|*.md) ;;
                *) docs_only=false; echo "Non-docs file: $f"; break ;;
              esac
            done <<< "$files"
          fi
          echo "docs_only=${docs_only}"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build
        run: go build ./...
      - name: gofmt
        run: bash scripts/gofmtcheck.sh
      - name: Vet
        run: go vet ./...
      # Blocking: any staticcheck finding fails CI.
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "latest"
          install-go: false
      - name: Unit tests
        run: go test ./... -race -timeout 120s

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "v1.17.2"
          terraform_wrapper: false
      - name: Generate docs
        run: go generate ./...
      - name: Validate docs
        run: go tool tfplugindocs validate --provider-name mysql
      # Fails when the committed docs/ differs from the generated output.
      - name: Check docs are up to date
        run: git diff --exit-code -- docs/

  acceptance:
    needs: [changes, test]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mysql: ["mysql:8.0", "mysql:8.4"]
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "v1.17.2"
          terraform_wrapper: false
      - name: Acceptance tests
        env:
          TF_ACC: "1"
          MYSQL_ENDPOINT: 127.0.0.1:3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: root
        run: go test ./mysql -run 'TestAcc' -v -timeout 20m

  # End-to-end test of port_forward_client_config against a real sshd and MySQL.
  tunnel:
    needs: [changes, test]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:26.10
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "v1.17.2"
          terraform_wrapper: false
      - name: Generate SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -t ed25519 -N '' -f "$HOME/.ssh/id_tunnel"
      - name: Start sshd
        run: |
          docker run -d --name sshd \
            --network ${{ job.services.mysql.network }} \
            -p 2222:2222 \
            -e PUID=1000 -e PGID=1000 \
            -e USER_NAME=tunnel \
            -e PUBLIC_KEY="$(cat "$HOME/.ssh/id_tunnel.pub")" \
            -e SUDO_ACCESS=false \
            lscr.io/linuxserver/openssh-server:latest
      # The image ships with "AllowTcpForwarding no"; the tunnel needs it.
      - name: Enable TCP forwarding in sshd
        run: |
          for _ in $(seq 1 30); do
            docker exec sshd test -f /config/sshd/sshd_config && break
            sleep 1
          done
          docker exec sshd sed -i 's/^AllowTcpForwarding.*/AllowTcpForwarding yes/' /config/sshd/sshd_config
          docker exec sshd grep -n '^AllowTcpForwarding' /config/sshd/sshd_config
          docker restart sshd
      - name: Wait for sshd
        run: |
          for _ in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes \
                -i "$HOME/.ssh/id_tunnel" -p 2222 tunnel@127.0.0.1 true; then
              echo "sshd is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs sshd
          echo "sshd did not become ready" >&2
          exit 1
      - name: Check MySQL is reachable from sshd
        run: docker exec sshd nc -z -w 5 mysql 3306
      - name: Tunnel acceptance tests
        env:
          TF_ACC: "1"
          MYSQL_PF_SSH_HOST: 127.0.0.1:2222
          MYSQL_PF_SSH_USER: tunnel
          MYSQL_PF_DB_ENDPOINT: mysql:3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: root
        run: |
          MYSQL_PF_SSH_KEY_PATH="$HOME/.ssh/id_tunnel" \
          go test ./mysql -run TestAccPortForward -v -timeout 10m
      - name: sshd logs
        if: failure()
        run: docker logs sshd

  # Single aggregate check for branch protection: skipped jobs count as passing,
  # failed or cancelled jobs fail it. Matrix job names are not usable as
  # required checks when the job is skipped, so require only `ci`.
  ci:
    needs: [changes, test, docs, acceptance, tunnel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "One or more jobs failed or were cancelled" >&2
            exit 1
          fi
          echo "All jobs succeeded or were skipped"
