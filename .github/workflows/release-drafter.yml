name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7

  publish_release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - release_draft
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          publish: true
          token: ${{ secrets.GITHUB_TOKEN }}
